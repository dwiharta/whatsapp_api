<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard Profil</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.navbar{background:#111827;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:bold;font-size:19px}.logout{color:#fff;text-decoration:none;background:#dc2626;padding:9px 14px;border-radius:8px}.container{max-width:1050px;margin:35px auto;padding:0 20px}.header{margin-bottom:25px}.header h1{margin:0 0 7px}.header p{color:#667085}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:22px}.card{background:#fff;border-radius:16px;padding:25px;box-shadow:0 8px 30px #0f172a14}.profile-item{padding:14px 0;border-bottom:1px solid #eaecf0}.profile-item:last-child{border-bottom:0}.profile-item small{display:block;color:#667085;margin-bottom:5px}.profile-item strong{word-break:break-word}label{display:block;font-weight:bold;margin:14px 0 7px}input,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:9px;font-size:15px}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.btn-save{background:#2563eb;color:#fff;margin-top:18px;width:100%}.btn-delete{background:#dc2626;color:#fff;margin-top:12px;width:100%}.note{margin-top:15px;background:#eff6ff;color:#1e40af;padding:12px;border-radius:9px;font-size:14px}.loading{text-align:center;padding:50px;color:#667085}@media(max-width:750px){.grid{grid-template-columns:1fr}.navbar{padding:16px 20px}}
</style></head><body><nav class="navbar"><div class="brand">Sistem Profil & WhatsApp</div><a class="logout" href="#" id="logout">Logout</a></nav><div class="container"><div class="header"><h1>Dashboard Profil</h1><p>Kelola data akun Anda melalui halaman ini.</p></div><div id="loading" class="loading">Memuat profil...</div><div class="grid" id="content" style="display:none"><div class="card"><h2>Profil Saya</h2><div class="profile-item"><small>Nama</small><strong id="viewNama"></strong></div><div class="profile-item"><small>Email</small><strong id="viewEmail"></strong></div><div class="profile-item"><small>No. HP</small><strong id="viewHp"></strong></div><div class="profile-item"><small>Alamat</small><strong id="viewAlamat"></strong></div><div class="profile-item"><small>ID Pengguna</small><strong id="viewId"></strong></div></div><div class="card"><h2>Edit Profil</h2><form id="formProfile"><label>Nama</label><input id="nama" type="text" name="nama" required><label>Email</label><input id="email" type="email" name="email" required><label>No. HP / WhatsApp</label><input id="no_hp" type="text" name="no_hp" required><label>Alamat</label><textarea id="alamat" name="alamat"></textarea><label>Password Baru <small>(kosongkan jika tidak ingin mengganti)</small></label><input type="password" name="password" minlength="6"><button class="btn-save" type="submit">Simpan Perubahan</button></form><div class="note">Setiap perubahan profil akan diproses melalui backend dan notifikasi WhatsApp.</div><button class="btn-delete" id="btnDelete">Hapus Akun</button></div></div></div><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let user=null;function api(path,opt={}){return fetch(API_BASE+path,{...opt,credentials:'include'})}function render(u){user=u;['Nama','Email','Hp','Alamat','Id'].forEach(k=>{const key=k==='Hp'?'no_hp':k==='Id'?'id':k.toLowerCase();$('view'+k).textContent=(u[key]??'')||'-'});$('nama').value=u.nama||'';$('email').value=u.email||'';$('no_hp').value=u.no_hp||'';$('alamat').value=u.alamat||'';$('loading').style.display='none';$('content').style.display='grid'}
(async()=>{try{const r=await api('/api/me.php');const x=await r.json();if(x.status==='success')render(x.user);else location.href='login.html'}catch(e){alert('Backend tidak dapat dihubungi.');location.href='login.html'}})();
$('formProfile').addEventListener('submit',async e=>{e.preventDefault();if(!confirm('Simpan perubahan profil?'))return;const b=e.target.querySelector('.btn-save');b.disabled=true;b.textContent='Menyimpan...';try{const r=await api('/api/update_profile.php',{method:'POST',body:new FormData(e.target)});const x=await r.json();if(x.status==='success'){alert(x.message+'\nNotifikasi WhatsApp: '+x.whatsapp);location.reload()}else alert(x.message)}catch(err){alert('Terjadi kesalahan koneksi ke server.')}finally{b.disabled=false;b.textContent='Simpan Perubahan'}});
$('btnDelete').addEventListener('click',async function(){if(!confirm('PERINGATAN!\n\nAkun akan dihapus secara permanen.\nLanjutkan?'))return;this.disabled=true;this.textContent='Menghapus...';try{const r=await api('/api/delete_account.php',{method:'POST'});const x=await r.json();if(x.status==='success'){alert(x.message+'\nNotifikasi WhatsApp: '+x.whatsapp);location.href='login.html'}else{alert(x.message);this.disabled=false;this.textContent='Hapus Akun'}}catch(e){alert('Terjadi kesalahan koneksi ke server.');this.disabled=false;this.textContent='Hapus Akun'}});
$('logout').addEventListener('click',async e=>{e.preventDefault();try{await api('/logout.php')}finally{location.href='login.html'}});
</script></body></html>
