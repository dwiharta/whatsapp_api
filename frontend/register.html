<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register - API WhatsApp</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a5f);display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}.card{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0004}h1{margin:0 0 8px}.subtitle{color:#667085;margin-bottom:25px}label{display:block;font-weight:bold;margin:15px 0 7px}input,textarea{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;outline:none}textarea{min-height:80px;resize:vertical}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:22px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65}.error{display:none;margin-top:15px;padding:11px;border-radius:9px;background:#fee2e2;color:#991b1b}.footer{text-align:center;margin-top:20px;color:#667085}a{color:#2563eb;text-decoration:none;font-weight:bold}</style></head><body><div class="card"><h1>Daftar Akun</h1><div class="subtitle">Buat akun untuk masuk ke sistem.</div><form id="formRegister"><label>Nama</label><input type="text" name="nama" required><label>Email</label><input type="email" name="email" required><label>No. HP / WhatsApp</label><input type="text" name="no_hp" placeholder="08xxxxxxxxxx" required><label>Alamat</label><textarea name="alamat" placeholder="Alamat lengkap"></textarea><label>Password</label><input type="password" name="password" minlength="6" required><button type="submit">Daftar</button></form><div id="error" class="error"></div><div class="footer">Sudah punya akun? <a href="login.html">Login</a></div></div><script src="config.js"></script><script>
const form=document.getElementById('formRegister'),box=document.getElementById('error');function showError(t){box.textContent=t;box.style.display='block'}form.addEventListener('submit',async e=>{e.preventDefault();box.style.display='none';const b=form.querySelector('button');b.disabled=true;b.textContent='Memproses...';try{const r=await fetch(API_BASE+'/api/register.php',{method:'POST',body:new FormData(form),credentials:'include'});const x=await r.json();if(x.status==='success'){alert('Pendaftaran berhasil!\nNotifikasi WhatsApp: '+x.whatsapp);location.href='login.html'}else showError(x.message||'Pendaftaran gagal.')}catch(err){showError('Tidak dapat terhubung ke backend. Periksa API_BASE dan CORS.')}finally{b.disabled=false;b.textContent='Daftar'}});
</script></body></html>
